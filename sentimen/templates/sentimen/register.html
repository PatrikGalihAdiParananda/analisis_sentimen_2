<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar - JKN-SENTI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      /* Style SAMA dengan login.html */
      body,
      html {
        height: 100%;
        width: 100%;
        margin: 0;
        font-family: "Inter", sans-serif;
        overflow: hidden;
      }
      body {
        background-color: #3443c7;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      #bg-3d-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.6;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        padding: 2.5rem;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        z-index: 1;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        animation: fadeIn 0.8s ease;
      }
      .form-control {
        background: rgba(255, 255, 255, 0.9);
        border: none;
        margin-bottom: 1rem;
        padding: 0.75rem;
      }
      .btn-primary {
        background-color: #fff;
        color: #3443c7;
        font-weight: bold;
        border: none;
        width: 100%;
        padding: 0.75rem;
        transition: 0.3s;
      }
      .btn-primary:hover {
        background-color: #f0f0f0;
        transform: translateY(-2px);
      }
      .text-white-50 a {
        color: #fff;
        text-decoration: underline;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Tambahan untuk error list Django */
      ul.errorlist {
        list-style: none;
        padding: 0;
        margin: 0 0 10px 0;
        color: #ffcccc;
        font-size: 0.85rem;
      }
      .helptext {
        display: none;
      } /* Sembunyikan helptext default Django agar rapi */
    </style>
  </head>
  <body>
    <canvas id="bg-3d-animation"></canvas>
    <div class="login-card">
      <h3 class="text-white text-center mb-4 fw-bold">Buat Akun Baru</h3>

      {% if messages %} {% for message in messages %}
      <div class="alert alert-danger p-2 small">{{ message }}</div>
      {% endfor %} {% endif %}

      <form method="POST">
        {% csrf_token %}
        <!-- Manual Input agar desain bagus -->
        <input type="text" name="username" class="form-control" placeholder="Username Baru" required />
        <input type="password" name="password" class="form-control" placeholder="Password" required />
        <input type="password" name="confirmation" class="form-control" placeholder="Ulangi Password" required />
        <div class="text-white-50 small mb-3" style="font-size: 0.75rem">*Password minimal 8 karakter & tidak umum.</div>

        <button type="submit" class="btn btn-primary rounded-pill mt-2">Daftar</button>
      </form>

      <div class="text-center mt-4">
        <small class="text-white-50">Sudah punya akun? <a href="{% url 'login' %}">Masuk</a></small>
      </div>
    </div>

    <!-- Script 3D Sama -->
    <script>
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("bg-3d-animation"), alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.position.z = 5;
      const geometry = new THREE.IcosahedronGeometry(2.2, 0);
      const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
      const crystal = new THREE.LineSegments(new THREE.EdgesGeometry(geometry), material);
      scene.add(crystal);
      function animate() {
        requestAnimationFrame(animate);
        crystal.rotation.x += 0.002;
        crystal.rotation.y += 0.002;
        renderer.render(scene, camera);
      }
      animate();
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
