<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - JKN-SENTI</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Pustaka Animasi 3D (Three.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
      /* Reset & Base Styles */
      body,
      html {
        height: 100%;
        width: 100%;
        margin: 0;
        font-family: "Inter", sans-serif;
        overflow: hidden; /* Mencegah scrollbar muncul karena canvas */
      }

      body {
        /* Latar belakang biru yang solid sebagai fallback */
        background-color: #3443c7;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      /* Canvas untuk Animasi 3D */
      #bg-3d-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0; /* Paling belakang */
        opacity: 0.6; /* Sedikit transparan agar tidak mengganggu */
      }

      /* Kartu Login (Glassmorphism) */
      .login-card {
        width: 100%;
        max-width: 400px;
        padding: 2.5rem;
        border-radius: 20px;

        /* Efek Kaca Buram */
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px); /* Safari support */

        /* Border halus */
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);

        z-index: 1; /* Di depan canvas */

        /* Animasi Muncul */
        animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .login-card-title {
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 0.5rem;
        letter-spacing: -0.5px;
      }

      .login-card-subtitle {
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 2rem;
        font-size: 0.9rem;
      }

      /* Styling Input Form */
      .form-control {
        background-color: rgba(255, 255, 255, 0.9);
        border: none;
        padding: 0.8rem 1rem;
        margin-bottom: 1rem;
        border-radius: 10px;
        font-size: 0.95rem;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        background-color: #ffffff;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
        outline: none;
      }

      .form-control::placeholder {
        color: #888;
      }

      /* Tombol Masuk */
      .btn-submit {
        background-color: #ffffff;
        color: #3443c7;
        font-weight: 700;
        padding: 0.8rem;
        border: none;
        border-radius: 10px;
        width: 100%;
        transition: all 0.3s ease;
        margin-top: 0.5rem;
      }

      .btn-submit:hover {
        background-color: #f0f0f0;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      /* Link Register */
      .register-text {
        margin-top: 1.5rem;
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.9rem;
      }

      .register-link {
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s;
      }

      .register-link:hover {
        border-bottom-color: #ffffff;
      }

      /* Pesan Error (Alert) */
      .alert {
        border-radius: 10px;
        font-size: 0.9rem;
        padding: 0.8rem;
        margin-bottom: 1.5rem;
        background-color: rgba(220, 53, 69, 0.9); /* Merah transparan */
        color: white;
        border: none;
      }

      /* Keyframes Animasi */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <!-- Kanvas Animasi 3D (Latar Belakang) -->
    <canvas id="bg-3d-animation"></canvas>

    <!-- Kartu Login -->
    <div class="login-card text-center">
      <div class="mb-4">
        <!-- Ikon Gembok Sederhana (SVG) -->
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="#fff" class="bi bi-shield-lock-fill" viewBox="0 0 16 16">
          <path
            fill-rule="evenodd"
            d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.777 11.777 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7.159 7.159 0 0 0 1.048-.625 11.775 11.775 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.541 1.541 0 0 0-1.044-1.263 62.467 62.467 0 0 0-2.887-.87C9.843.266 8.69 0 8 0zm0 5a1.5 1.5 0 0 1 .5 2.915l.385 1.99a.5.5 0 0 1-.491.595h-.788a.5.5 0 0 1-.49-.595l.384-1.99A1.5 1.5 0 0 1 8 5z"
          />
        </svg>
      </div>

      <h2 class="login-card-title">Selamat Datang</h2>
      <p class="login-card-subtitle">Masuk untuk mengakses Dashboard Analisis</p>

      <!-- Pesan Error Django (Jika password salah) -->
      {% if messages %} {% for message in messages %}
      <div class="alert alert-danger shadow-sm" role="alert">{{ message }}</div>
      {% endfor %} {% endif %}

      <!-- Form Login Manual -->
      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="mb-3">
          <input type="text" class="form-control" name="username" placeholder="Username" required autofocus />
        </div>

        <div class="mb-4">
          <input type="password" class="form-control" name="password" placeholder="Password" required />
        </div>

        <button type="submit" class="btn btn-submit">Masuk</button>
      </form>

      <div class="register-text">Belum punya akun? <a href="{% url 'register' %}" class="register-link">Daftar Sekarang</a></div>
    </div>

    <!-- Script Animasi 3D (Icosahedron Berputar) -->
    <script>
      // Inisialisasi Three.js
      const canvas = document.getElementById("bg-3d-animation");
      const scene = new THREE.Scene();

      // Kamera
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;

      // Renderer (Transparan)
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true, // Latar belakang transparan
        antialias: true, // Supaya garis tidak bergerigi
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio); // Tajam di layar retina

      // Membuat Objek Geometri (Icosahedron)
      const geometry = new THREE.IcosahedronGeometry(2.2, 0); // Radius 2.2, Detail 0
      const edges = new THREE.EdgesGeometry(geometry); // Ambil garis tepinya saja

      // Material Garis (Putih, Transparan)
      const material = new THREE.LineBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.35, // Tingkat transparansi
        linewidth: 2,
      });

      // Gabungkan Geometri dan Material menjadi Mesh
      const crystal = new THREE.LineSegments(edges, material);
      scene.add(crystal);

      // Fungsi Animasi (Looping)
      function animate() {
        requestAnimationFrame(animate);

        // Rotasi pelan pada sumbu X dan Y
        crystal.rotation.x += 0.002;
        crystal.rotation.y += 0.003;

        // Efek "bernapas" (sedikit maju mundur)
        // camera.position.z = 5 + Math.sin(Date.now() * 0.001) * 0.2;

        renderer.render(scene, camera);
      }

      // Jalankan Animasi
      animate();

      // Handle Resize (Responsif saat layar diubah ukurannya)
      window.addEventListener("resize", () => {
        const width = window.innerWidth;
        const height = window.innerHeight;

        renderer.setSize(width, height);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      });
    </script>
  </body>
</html>
